<!doctype html>
<html><head><meta charset="utf-8"><title>Glow cutout — try your photos</title>
<style>
  :root{--cream:#F7F3EE;--warm:#EDE6DA;--border:#C8BDB4;--text:#3D2E1E;--muted:#5C4E43;--accent:#A07850}
  body{margin:0;font-family:'DM Sans',system-ui;background:var(--cream);color:var(--text)}
  header{padding:18px 20px;border-bottom:.5px solid var(--border);background:#fff}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:26px;margin:0 0 4px}
  .sub{font-size:13px;color:var(--muted)}
  #drop{margin:18px 20px;padding:26px;border:1.5px dashed var(--border);border-radius:16px;text-align:center;background:#fff;cursor:pointer}
  #drop.hot{background:var(--warm);border-color:var(--accent)}
  #drop b{color:var(--accent)}
  .pair{display:flex;flex-wrap:wrap;gap:14px;padding:0 20px 20px;align-items:flex-start}
  .card{background:#fff;border:.5px solid var(--border);border-radius:16px;padding:12px}
  .card img,.card canvas{width:300px;height:auto;display:block;border-radius:10px}
  .cap{font-size:12px;color:var(--muted);padding:6px 2px 0}
  .dl{display:inline-block;margin-top:6px;font-size:12px;color:var(--accent);text-decoration:none}
  #log{padding:0 20px 20px;font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;white-space:pre-wrap}
</style></head>
<body>
<header>
  <h1>Glow cutout — try your photos</h1>
  <div class="sub">Runs entirely on your device. Nothing uploads anywhere.</div>
</header>
<div id="drop">Drop photos here, or <b>click to choose</b> — you can pick several at once
  <input id="file" type="file" accept="image/*" multiple hidden>
</div>
<div id="log">loading model…</div>
<div id="out"></div>
<script type="module">
const CREAM='#F7F3EE', CAN=1024, FILL=0.90, SIZE=512
const logEl=document.getElementById('log'), out=document.getElementById('out')
const log=m=>{logEl.textContent=m}
let model, RawImage, Tensor

function enhance(id,W,H){
  const px=id.data; let lo=255,hi=0,n=0,sum=0
  for(let i=0;i<W*H;i++){ if(px[i*4+3]<128) continue
    const l=0.299*px[i*4]+0.587*px[i*4+1]+0.114*px[i*4+2]
    if(l<lo)lo=l; if(l>hi)hi=l; sum+=l; n++ }
  if(!n) return
  const mean=sum/n; lo=Math.max(0,lo-4); hi=Math.min(255,hi+4)
  const range=Math.max(1,hi-lo)
  const norm=Math.min(.95,Math.max(.05,(mean-lo)/range))
  const g=Math.min(1.6,Math.max(.6,Math.log(.52)/Math.log(norm)))
  const lut=new Uint8ClampedArray(256)
  for(let v=0;v<256;v++){let t=Math.min(1,Math.max(0,(v-lo)/range));t=Math.pow(t,g)
    t=t+.10*t*(1-t)*(t-.5)*2; lut[v]=Math.round(Math.min(1,Math.max(0,t))*255)}
  for(let i=0;i<W*H;i++){ if(px[i*4+3]===0) continue
    let r=lut[px[i*4]],gg=lut[px[i*4+1]],b=lut[px[i*4+2]]
    const l=.299*r+.587*gg+.114*b, mx=Math.max(r,gg,b), mn=Math.min(r,gg,b)
    const amt=.22*(1-(mx-mn)/255)
    px[i*4]=l+(r-l)*(1+amt); px[i*4+1]=l+(gg-l)*(1+amt); px[i*4+2]=l+(b-l)*(1+amt) }
}

async function process(file){
  const t0=performance.now()
  const url=URL.createObjectURL(file)
  const img=new Image(); img.src=url; await img.decode()
  const W=img.naturalWidth,H=img.naturalHeight
  const full=document.createElement('canvas'); full.width=W; full.height=H
  full.getContext('2d').drawImage(img,0,0)

  // letterbox to 512² (never squash)
  const sf=SIZE/Math.max(W,H)
  const fw=Math.max(1,Math.round(W*sf)), fh=Math.max(1,Math.round(H*sf))
  const oX=Math.floor((SIZE-fw)/2), oY=Math.floor((SIZE-fh)/2)
  const pad=document.createElement('canvas'); pad.width=SIZE; pad.height=SIZE
  const pc=pad.getContext('2d'); pc.fillStyle='#808080'; pc.fillRect(0,0,SIZE,SIZE)
  pc.imageSmoothingQuality='high'; pc.drawImage(full,0,0,W,H,oX,oY,fw,fh)

  const rgb=(await RawImage.fromCanvas(pad)).rgb()
  const d=rgb.data,ch=rgb.channels
  const chw=new Float32Array(3*SIZE*SIZE)
  for(let i=0;i<SIZE*SIZE;i++)for(let c=0;c<3;c++)chw[c*SIZE*SIZE+i]=((d[i*ch+c]/255)-.5)/.5
  const res=await model({input:new Tensor('float32',chw,[1,3,SIZE,SIZE])})
  const od=res[Object.keys(res)[0]].data
  const cb=new Uint8ClampedArray(fw*fh)
  for(let y=0;y<fh;y++)for(let x=0;x<fw;x++)cb[y*fw+x]=Math.round(od[(y+oY)*SIZE+(x+oX)]*255)
  const mr=await new RawImage(cb,fw,fh,1).resize(W,H)

  // keep only the largest connected region (drops detached debris)
  const md=mr.data, mc=mr.channels||1
  const alpha=new Uint8ClampedArray(W*H)
  for(let i=0;i<W*H;i++) alpha[i]=md[i*mc]
  {
    const lab=new Int32Array(W*H).fill(-1), st=new Int32Array(W*H)
    let best=-1,bestN=0,cur=0
    for(let p0=0;p0<W*H;p0++){
      if(lab[p0]!==-1||alpha[p0]<=12) continue
      let sp=0,n=0; st[sp++]=p0; lab[p0]=cur
      while(sp>0){const q=st[--sp]; n++; const qx=q%W, qy=(q/W)|0
        if(qx>0){const r=q-1;if(lab[r]===-1&&alpha[r]>12){lab[r]=cur;st[sp++]=r}}
        if(qx<W-1){const r=q+1;if(lab[r]===-1&&alpha[r]>12){lab[r]=cur;st[sp++]=r}}
        if(qy>0){const r=q-W;if(lab[r]===-1&&alpha[r]>12){lab[r]=cur;st[sp++]=r}}
        if(qy<H-1){const r=q+W;if(lab[r]===-1&&alpha[r]>12){lab[r]=cur;st[sp++]=r}}}
      if(n>bestN){bestN=n;best=cur} cur++
    }
    if(best>=0&&cur>1) for(let i=0;i<W*H;i++) if(lab[i]!==best) alpha[i]=0
  }

  const work=document.createElement('canvas'); work.width=W; work.height=H
  const wx=work.getContext('2d'); wx.drawImage(full,0,0)
  const id=wx.getImageData(0,0,W,H)
  for(let i=0;i<W*H;i++) id.data[i*4+3]=alpha[i]
  enhance(id,W,H)
  wx.putImageData(id,0,0)

  let aX=W,aY=H,bX=0,bY=0
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(id.data[(y*W+x)*4+3]>12){if(x<aX)aX=x;if(x>bX)bX=x;if(y<aY)aY=y;if(y>bY)bY=y}}
  const bw=bX-aX+1,bh=bY-aY+1,sc=(CAN*FILL)/Math.max(bw,bh)
  const nw=Math.round(bw*sc),nh=Math.round(bh*sc)
  const c=document.createElement('canvas'); c.width=CAN; c.height=CAN
  const g=c.getContext('2d'); g.fillStyle=CREAM; g.fillRect(0,0,CAN,CAN)
  g.imageSmoothingQuality='high'
  g.drawImage(work,aX,aY,bw,bh,(CAN-nw)/2,(CAN-nh)/2,nw,nh)

  const wrap=document.createElement('div'); wrap.className='pair'
  const c1=document.createElement('div'); c1.className='card'
  const im=document.createElement('img'); im.src=url
  c1.append(im); const p1=document.createElement('div'); p1.className='cap'
  p1.textContent=`original · ${W}×${H}`; c1.append(p1)
  const c2=document.createElement('div'); c2.className='card'; c2.append(c)
  const p2=document.createElement('div'); p2.className='cap'
  p2.textContent=`cutout + enhanced · ${((performance.now()-t0)/1000).toFixed(1)}s`
  const a=document.createElement('a'); a.className='dl'; a.textContent='⤓ download'
  a.download=(file.name.replace(/\.[^.]+$/,''))+'-glow.png'; a.href=c.toDataURL('image/png')
  c2.append(p2,a); wrap.append(c1,c2); out.prepend(wrap)
}

const {AutoModel,RawImage:RI,Tensor:T}=await import('https://esm.sh/@huggingface/transformers@3.5.0')
RawImage=RI; Tensor=T
model=await AutoModel.from_pretrained('Xenova/modnet',{device:navigator.gpu?'webgpu':'wasm',dtype:'fp32',
  progress_callback:p=>{if(p.status==='progress'&&p.file&&p.file.endsWith('.onnx'))log('downloading model… '+Math.round(p.progress||0)+'%')}})
log('Ready — drop in as many photos as you like.')

const drop=document.getElementById('drop'), fileIn=document.getElementById('file')
drop.onclick=()=>fileIn.click()
fileIn.onchange=async e=>{ for(const f of e.target.files){ log('working on '+f.name+'…'); await process(f) } log('Done.') }
drop.ondragover=e=>{e.preventDefault();drop.classList.add('hot')}
drop.ondragleave=()=>drop.classList.remove('hot')
drop.ondrop=async e=>{e.preventDefault();drop.classList.remove('hot')
  for(const f of e.dataTransfer.files){ if(!f.type.startsWith('image/'))continue; log('working on '+f.name+'…'); await process(f) } log('Done.') }
</script>
</body></html>
